<h1>PDF.js 'Hello, base64!' example</h1>

<p>Please use <a href="https://mozilla.github.io/pdf.js/getting_started/#download"><i>official releases</i></a> in production environments.</p>

<button id="btn-example">Example</button>
<input type="file" id="file-input">
  
<canvas id="the-canvas"></canvas>

<script type="module">
  // Loaded via <script> tag, create shortcut to access PDF.js exports.
  var { pdfjsLib } = globalThis;
  
  // The workerSrc property shall be specified.
  pdfjsLib.GlobalWorkerOptions.workerSrc = '//mozilla.github.io/pdf.js/build/pdf.worker.mjs';

  function render(pdfData) {
    // Using DocumentInitParameters object to load binary data.
    var loadingTask = pdfjsLib.getDocument({data: pdfData});
    loadingTask.promise.then(function(pdf) {
      console.log('PDF loaded');
      
      // Fetch the first page
      var pageNumber = 1;
      pdf.getPage(pageNumber).then(function(page) {
        console.log('Page loaded');
  
        var scale = 5;
        var viewport = page.getViewport({scale: scale});
  
        // Prepare canvas using PDF page dimensions
        var canvas = document.getElementById('the-canvas');
        var context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
  
        // Render PDF page into canvas context
        var renderContext = {
          canvasContext: context,
          viewport: viewport
        };
        
        var renderTask = page.render(renderContext);
        renderTask.promise.then(function () {
          console.log('Page rendered');
        });
      });
    }, function (reason) {
      // PDF loading error
      console.error(reason);
    });
  }
  
  document.getElementById("btn-example").addEventListener("click", function () {
    // https://mozilla.github.io/pdf.js/examples/
     const pdfData = atob(
      'JVBERi0xLjcKCjEgMCBvYmogICUgZW50cnkgcG9pbnQKPDwKICAvVHlwZSAvQ2F0YWxvZwog' +

      'MDAwIG4gCjAwMDAwMDAzODAgMDAwMDAgbiAKdHJhaWxlcgo8PAogIC9TaXplIDYKICAvUm9v' +
      'dCAxIDAgUgo+PgpzdGFydHhyZWYKNDkyCiUlRU9G'
     );
    
    render(pdfData);
  }
  
  const fileInputElement = document.getElementById("file-input");
  fileInputElement.addEventListener("change", async function () {
    const pdfData = await new Promise((res) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        res(new Uint8Array(event.target.result));
      }
      reader.readAsArrayBuffer(this.files[0]);
    });

    render(pdfData);
  }, false);
</script>
